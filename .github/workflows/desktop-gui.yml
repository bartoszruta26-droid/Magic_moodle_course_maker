name: Desktop GUI

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "desktopgui/**"
      - "magic_moodle/application/**"
      - "tests/core/test_desktopgui.py"
      - ".github/workflows/desktop-gui.yml"
  pull_request:
    paths:
      - "desktopgui/**"
      - "magic_moodle/application/**"
      - "tests/core/test_desktopgui.py"
      - ".github/workflows/desktop-gui.yml"
  workflow_dispatch:

jobs:
  desktop-smoke:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
      - name: Install DesktopGUI dependencies
        run: python -m pip install -e ".[desktop]"
      - name: Build and inspect desktop window
        run: |
          timeout 60s python - <<'PY'
          import os
          import tempfile
          from pathlib import Path

          from PySide6.QtCore import QTimer
          from PySide6.QtWidgets import QApplication, QLineEdit, QMessageBox, QPushButton
          from desktopgui.app import _build_window

          with tempfile.TemporaryDirectory() as temporary:
              root = Path(temporary)
              course = root / "sample"
              course.mkdir()
              (course / "course.yaml").write_text(
                  "course:\\n  full_name: Kurs GUI\\n  short_name: GUI\\n",
                  encoding="utf-8",
              )
              section = course / "sections" / "intro"
              section.mkdir(parents=True)
              (section / "section.yaml").write_text(
                  "id: intro\\nname: Wprowadzenie\\nmodules: []\\n",
                  encoding="utf-8",
              )
              os.environ["MAGIC_MOODLE_COURSES"] = temporary
              app = QApplication([])
              window = _build_window()
              window.show()
              assert window.course_list.count() == 1
              window.course_list.setCurrentRow(0)
              assert "Kurs GUI" in window.details.toPlainText()
              labels = [button.text() for button in window.findChildren(QPushButton)]
              assert "Edytuj wersję roboczą" in labels

              def edit_and_accept():
                  dialog = app.activeModalWidget()
                  assert dialog is not None
                  fields = dialog.findChildren(QLineEdit)
                  fields[0].setText("Kurs GUI po edycji")
                  def dismiss_notice():
                      active = app.activeModalWidget()
                      if isinstance(active, QMessageBox):
                          active.accept()
                      else:
                          QTimer.singleShot(10, dismiss_notice)

                  QTimer.singleShot(10, dismiss_notice)
                  dialog.accept()

              QTimer.singleShot(0, edit_and_accept)
              window.edit_course_draft()
              assert window._draft.revision == 2
              preview = window.draft_service.preview(window._draft.draft_id)
              assert preview["course"]["course"]["full_name"] == "Kurs GUI po edycji"
              window.close()
              # Terminate after assertions; Qt platform teardown can block on headless runners.
              import sys
              sys.stdout.flush()
              os._exit(0)
          PY
