name: Core tests

on:
  push:
    branches: [main, "feature/**", "audit/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Smoke test Textual TUI
        run: python -c "from tui.app import _build_app; app = _build_app(); assert app.title == 'Magic Moodle Course Maker'"
      - run: python -m compileall -q magic_moodle webui
      - name: Check WebUI JavaScript syntax
        run: node --check webui/static/app.js
      - name: Smoke test existing MED.10 course structure
        run: python -m magic_moodle inspect courses/03-kurs-masazysta-med10
      - name: Validate MED.10 GIFT question bank
        run: python -m magic_moodle bank-validate courses/03-kurs-masazysta-med10/question-bank
      - name: Export MED.10 question bank to Moodle XML
        run: python -m magic_moodle bank-to-xml courses/03-kurs-masazysta-med10/question-bank build/med10-question-bank.xml --category '$course$/MED.10'
      - name: Verify generated Moodle XML
        run: python -c "import xml.etree.ElementTree as ET; r=ET.parse('build/med10-question-bank.xml').getroot(); assert len(r.findall('question')) > 20"
      - name: Lint Moodle local plugin PHP
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli
          find moodle-plugin/local/magicmoodle -name '*.php' -print0 | xargs -0 -n1 php -l
