# Aktywność typu glossary — słownik pojęć kursu
glossary:
  name: "Słownik pojęć masażu (MED.10)"
  intro: |
    Podstawowe terminy używane w kursie; uzupełnienie załącznika G.
  intro_format: markdown
  entries:
  - term: "Masaż klasyczny"
    definition: "Systematyczny zespół ruchów wykonywanych na powierzchni ciała w celu oddziaływania na tkanki, krążenie i układ nerwowy."
    format: html
  - term: "Głaskanie (effleurage)"
    definition: "Technika masażu polegająca na delikatnym przesuwaniu dłoni po skórze; zwykle otwiera i zamyka zabieg."
    format: html
  - term: "Rozcieranie (friction)"
    definition: "Technika wykonywana ruchami okrężnymi lub poprzecznymi z większym naciskiem miejscowym, wpływająca na głębsze warstwy tkanek."
    format: html
  - term: "Ugniatanie (petrissage)"
    definition: "Chwytanie i przemieszczanie mięśni; wpływa na elastyczność mięśni i krążenie lokalne."
    format: html
  - term: "Oklepywanie (tapotement)"
    definition: "Technika rytmicznych uderzeń krawędzią lub palcami dłoni, pobudzająca unerwienie i napięcie mięśniowe."
    format: html
  - term: "Wibracja"
    definition: "Technika przenoszenia drgań na tkanki dłonią lub aparatem; o działaniu rozluźniającym lub pobudzającym."
    format: html
  - term: "Przeciwwskazanie bezwzględne"
    definition: "Stan, w którym masaż nie może być wykonany do czasu decyzji lekarza (np. ostre stany zapalne, gorączka, zakrzepica)."
    format: html
  - term: "Przeciwwskazanie względne"
    definition: "Stan wymagający modyfikacji techniki, siły lub czasu zabiegu po konsultacji."
    format: html
  - term: "Aseptyka"
    definition: "Zbiór zabiegów zapobiegających przedostaniu się drobnoustrojów do organizmu."
    format: html
  - term: "Antyseptyka"
    definition: "Zniszczenie lub ograniczenie drobnoustrojów na skórze i błonach śluzowych środkami chemicznymi."
    format: html
  - term: "Ergonomia stanowiska"
    definition: "Dostosowanie stołu, oświetlenia i postawy ciała masażysty tak, by chronić kręgosłup i stawy przed przeciążeniem."
    format: html
  - term: "BLS (Basic Life Support)"
    definition: "Podstawowe zabiegi resuscytacyjne: uciskanie klatki piersiowej i oddechy ratownicze do czasu przyjazdu pomocy."
    format: html
  - term: "Drenaż limfatyczny"
    definition: "Delikatna technika manualna wspomagająca przepływ chłonki; stosowana m.in. w obrzękach."
    format: html
  - term: "Masaż sportowy"
    definition: "Masaż stosowany w cyklu treningowym i startowym zawodnika: przygotowanie, regeneracja, wsparcie leczenia pourazowego."
    format: html
  - term: "Masaż Shantala"
    definition: "Masaż niemowląt i małych dzieci; wspiera rozwój i więź z opiekunem."
    format: html
  - term: "Tensegracja (masaż powięziowy)"
    definition: "Praca z powięziami i linią oddechową, wpływająca na równowagę napięć całego ciała."
    format: html
  - term: "Świadoma zgoda klienta"
    definition: "Potwierdzenie przez klienta zgody na zabieg po zapoznaniu z celem, przebiegiem i możliwym ryzykiem."
    format: html
  - term: "Granice kompetencji"
    definition: "Zestaw czynności, których masażysta nie wykonuje (rozpoznawanie chorób, zabiegi wykraczające poza kwalifikację MED.10)."
    format: html
  - term: "Powięź (fascia)"
    definition: "Tkanka łączna otaczająca mięśnie, narządy i grupy struktur; w masażu powięziowym wpływa na równowagę napięć całego ciała."
    format: html
  - term: "Przeciwne ruchy (technika przeciwna)"
    definition: "Sposób pracy z tkanką polegający na połączeniu dwóch chwytów o przeciwnych wektorach, stosowany m.in. przy rozluźnianiu przykurczów."
    format: html
  - term: "Masaż segmentarny"
    definition: "Masaż okolic odpowiadających (refleksyjnych) z określonymi segmentami kręgosłupa i unerwianymi przez nie narządami."
    format: html
  - term: "Masaż limfatyczny (manualny drenaż limfatyczny)"
    definition: "Technika o sekwencyjnym, wolnym tempie i delikatnym nacisku, wspomagająca przepływ chłonki w obrzękach zastoinowych."
    format: html
  - term: "Kinezyterapia"
    definition: "Leczenie ruchem; dziedzina współpracująca z masażem — dobór ćwiczeń biernej i czynnej mobilizacji."
    format: html
  - term: "Fizykoterapia"
    definition: "Dziedzina fizjoterapii wykorzystująca bodźce fizyczne (ciepło, zimno, prąd, światło, ultradźwięki); masażysta zna jej zasady dla bezpiecznej współpracy."
    format: html
  - term: "Bolesność punktu spustowego (trigger point)"
    definition: "Ognisko wzmożonego napięcia w mięśniu promieniujące bólem; jego lokalizacja i techniki lecznicze należą do kompetencji diagnostycznych fizjoterapeuty/lekarza."
    format: html
  - term: "Effleurage / petrissage / tapotement"
    definition: "Francuskie nazwy czterech podstawowych technik masażu klasycznego: głaskanie, rozcieranie, ugniatanie i oklepywanie."
    format: html
  - term: "Odczyn posmasażowy"
    definition: "Przejściowe zmiany samopoczucia po zabiegu (rozwolnienie, senność, lekkie bolesność mięśni); prawidłowo opisane w karcie klienta."
    format: html
  - term: "Karta klienta (dokumentacja)"
    definition: "Pisemny zapis wywiadu, zaleceń i przebiegu zabiegów — wzór w Załączniku C; służy bezpieczeństwu pacjenta i ciągłości opieki."
    format: html
  - term: "Zasada primum non nocere"
    definition: "„Po pierwsze nie szkodzić” — naczelna reguła postępowania osób służby zdrowia, w tym masażystów."
    format: html
  - term: "MED.10"
    definition: "Kwalifikacja wyodrębniona w zawodzie technika masażysta — „Świadczenie usług w zakresie masażu”. Jej posiadanie potwierdza egzamin okręgowej komisji egzaminacyjnej OKE."
    format: html
  - term: "Technika podstawowa masażu"
    definition: "Cztery główne rodzaje ruchów masażu klasycznego: głaskanie, rozcieranie, ugniatanie i oklepywanie, uzupełnione o wibrację; każda ma własne wskazania, dawkowanie i kolejność w sekwencji zabiegu."
    format: html
  - term: "Masaż suchy"
    definition: "Masaż wykonywany bez środków poślizgowych, np. przy pracy na tkance łącznej lub gdy preparat jest przeciwwskazany (zmiany skórne, alergia); wymaga szczególnej dbałości o technikę, by nie uszkodzić naskórka."
    format: html
  - term: "Masaż pośredni"
    definition: "Masaż wykonywany przez materiał (ręcznik, gazę) albo z użyciem przyrządu — stosowany przy wrażliwej lub uszkodzonej skórze oraz w masażu przyrządowym."
    format: html
  - term: "Drenaż limfatyczny metodą Voddera"
    definition: "Manualny drenaż limfatyczny oparty na powolnych, rytmicznych chwytach pompowych i kołowych, wykonywany w kierunku węzłów chłonnych; podstawowa metoda w leczeniu obrzęków limfatycznych."
    format: html
  - term: "Kompleksowa terapia przeciwobrzękowa (CDT)"
    definition: "Łączenie drenażu limfatycznego, bandażowania kompresyjnego, pielęgnacji skóry i ćwiczeń — standard postępowania w obrzękach limfatycznych wtórnych, np. po leczeniu onkologicznym; wymaga zlecenia i nadzoru lekarza."
    format: html
  - term: "Faza niewydolności pompy żylnej"
    definition: "Stan, w którym krążenie żylne i limfatyczne kończyny nie odprowadza prawidłowo krwi i chłonki — objawia się obrzękiem, uczuciem ciężkości; masaż wykonuje się wtedy wyłącznie delikatnie, zgodnie ze wskazaniami, omijając miejsca niewydolnych zastawek i żylaki."
    format: html
  - term: "Masaż łąkotkowy (okostnowy)"
    definition: "Masaż działający na okostną i przegrody mięśniowe przez punktowy, wolno przesuwany ucisk; odczuwalny mocno, ale nie powinien powodować bólu promieniującego ani siniaków — dobiera go lekarz/fizjoterapeuta w określonych wskazaniach."
    format: html
  - term: "Refleksologia"
    definition: "Metoda odruchowego oddziaływania na stopy (lub dłonie, twarz) poprzez ucisk określonych stref; jako masaż odruchowy klasyfikowana według dowodów naukowych jako wspomagająca relaks — nie leczy chorób i nie zastępuje diagnostyki medycznej."
    format: html
  - term: "Linia oddechowa (respiratory line)"
    definition: "Praca z taśmą przednią ciała (stopy – uda – brzuch – przepona – klatka piersiowa – gardło – twarz) w masażu tensegracyjnym; służy wyrównaniu napięć powięzi i pogłębieniu oddechu."
    format: html
  - term: "Cykl treningowy (makro-, mezo-, mikrocykl)"
    definition: "Struktura planowania obciążeń sportowych: makrocykl (sezon), mezoocykl (kilka tygodni), mikrocykl (tydzień); masaż sportowy dobiera się do fazy cyklu — przygotowawczej, startowej lub regeneracyjnej."
    format: html
  - term: "Masaż przedstartowy (rozgrzewający)"
    definition: "Krótki, szybki masaż pobudzający wykonywany kilkanaście minut przed wysiłkiem; cel: zwiększyć temperaturę tkanek i gotowość neuromięśniową, bez głębokiego rozluźniania, które mogłoby obniżyć siłę mięśniową."
    format: html
  - term: "Masaż powysiłkowy (regeneracyjny)"
    definition: "Masaż wykonany po wysiłku — najpierw delikatny odprowadzający, potem umiarkowanie pogłębiający; wspomaga usuwanie metabolitów i subiektywne zmniejszenie bolesności mięśni; nie zastępuje odpoczynku ani nawodnienia."
    format: html
  - term: "DOMS (opóźniona bolesność mięśniowa)"
    definition: "Zespolona bolesność mięśni pojawiająca się 12–72 h po nietypowym lub intensywnym wysiłku; masaż łagodny może przynieść ulgę subiektywną, lecz unika się mocnych technik na silnie uszkodzony mięsień."
    format: html
  - term: "Shantala"
    definition: "Tradycyjny indyjski masaż niemowląt rozpowszechniony przez F. Leboyera; wykonywany bardzo delikatnie, z olejkiem, w atmosferze spokoju; wspiera więź z opiekunem — nigdy nie wykonuje się go na dziecku chorym, gorączkującym ani bezpośrednio po karmieniu."
    format: html
  - term: "Elektroterapia"
    definition: "Podgrupa fizykoterapii wykorzystująca prąd elektryczny (np. TENS — przezskórna stymulacja nerwów w celu złagodzenia bólu); zabiegi wykonuje uprawniony personel medyczny na zlecenie lekarza."
    format: html
  - term: "Świadoma zgoda pacjenta"
    definition: "Zgoda udzielona po zrozumieniu informacji o celu, rodzaju, przebiegu i ryzyku zabiegu; wyrażana dobrowolnie, możliwa do cofnięcia w każdej chwili — dokumentowana zgodnie z Załącznikiem C."
    format: html
  - term: "RODO"
    definition: "Rozporządzenie Parlamentu Europejskiego i Rady (UE) 2016/679 o ochronie danych osobowych; dane o zdrowiu są szczególną kategorią danych — masażysta przechowuje je poufnie, minimalnie i tylko w celu opieki nad klientem."
    format: html
  - term: "Tajemnica zawodowa"
    definition: "Obowiązek nieujawniania informacji uzyskanych w związku z wykonywaniem zawodu; dotyczy stanu zdrowia, danych osobowych i okoliczności życia klienta; uchyla ją jedynie zwolnienie ustawowe lub sądowe."
    format: html
  - term: "Zdarzenie niepożądane"
    definition: "Każde niezamierzone zdarzenie podczas zabiegu (np. otarcie skóry, omdlenie, nasilenie bólu); obligatoryjnie notowane w Karcie zdarzenia niepożądanego (Załącznik C.10) i zgłaszane przełożonemu/lekarzowi zgodnie z procedurą B.6."
    format: html
  - term: "Ekspozycja zawodowa"
    definition: "Narażenie na kontakt z materiałem potencjalnie zakaźnym (krew, wydzieliny) przez skaleczenie lub zachlapanie; postępowanie określa procedura I.8 — zdjęcie rękawiczek, przepłukanie, dezynfekcja, zgłoszenie, ocena ryzyka przez lekarza medycyny pracy."
    format: html
  - term: "Ergonomia chwytu"
    definition: "Takie ustawienie dłoni, przedramion i tułowia masażysty, by siła pochodziła z masy ciała i dużych grup mięśniowych, a nie ze stawów — chroni przed zespołami przeciążeniowymi (np. cieśnią nadgarstka)."
    format: html
  - term: "Przeciążenie pourazowe"
    definition: "Nadmierne obciążenie tkanek prowadzące do mikrourazów (np. entezopatie ścięgna Achillesa, łokieć przyśrodkowy/boczny); masażysta rozpoznaje objawy alarmowe i kieruje do lekarza, nie wykonując głębokiego masażu w ostrej fazie zapalnej."
    format: html
  - term: "Zmiana skórna"
    definition: "Każde odstępstwo wyglądu lub czucia skóry (wykwit, rana, zmiana barwy znamienia); masażysta nie diagnozuje — ocenia, czy masaż jest bezpieczny, a przy zmianach ropnych, świeżych lub niepokojących przekazuje klienta lekarzowi (Załącznik E.14)."
    format: html
  - term: "Znamienne (pieprzyk) — zasada ABCDE"
    definition: "Asymetria, Brzegi nieregularne, Colour (różnobarwność), Diameter >6 mm, Evolution (zmiany w czasie) — reguła ostrożności: znamiona zmienione chroni się przed tarciem i zgłasza lekarzowi; masażysta ich nie ocenia rozpoznawczo."
    format: html
  - term: "Palpacja"
    definition: "Badanie dotykiem: ocena temperatury, napięcia, bolesności i ruchomości tkanek; służy kwalifikacji do zabiegu i kontroli jego efektów — zawsze w granicach kompetencji, bez stawiania rozpoznań chorobowych."
    format: html
  - term: "Bolesność miejscowa"
    definition: "Odczyn tkanki na dotyk w określonym punkcie; masażysta rejestruje ją w karcie zabiegu i dostosowuje siłę technik, a przy bólu promieniującym lub nietypowym — konsultuje z lekarzem."
    format: html
  - term: "Tonus mięśniowy"
    definition: "Prawidłowe, utrzymywane napięcie spoczynkowe mięśnia; w patologii bywa obniżony (wiotkość) lub podwyższony (spastyczność, sztywność pozapiramidowa); masażysta zna różnice, bo dobór techniki zależy od tonusu, a przy zaburzeniach neurologicznych działa zgodnie ze wskazaniami lekarza."
    format: html
  - term: "Przeciwwskazanie lokalne"
    definition: "Stan uniemożliwiający masaż tylko w określonej okolicy (np. zmiana skórna, żylaki w miejscu zabiegu, świeża blizna); dopuszcza wykonanie masażu pozostałych części ciała po ocenie bezpieczeństwa."
    format: html
  - term: "Okres okołomenstruacyjny"
    definition: "Faza cyklu miesiączkowego; masaż relaksacyjny jest zwykle dobrze tolerowany, jednak przy silnym bólu menstruacyjnym stosuje się pozycje komfortowe i techniki łagodne, a przy podejrzeniu stanu ostrego — kieruje do lekarza."
    format: html
  - term: "Ciąża — pozycje bezpieczne"
    definition: "Po I trymestrze unika się pozycji leżącej na plecach (ryzyko ucisku żyły głównej dolnej); preferowane leżenie na boku z podparciem podudzi i poduszek; masaż wykonuje się delikatnie, z uwzględnieniem przeciwwskazań położniczych (Załącznik D.11)."
    format: html
  - term: "Diastaza mięśnia prostego brzucha"
    definition: "Rozstąpienie linii białej po ciąży; masażysta nie wykonuje głębokich technik w okolicy osłabionej, a instruktaż ćwiczeń pozostawia fizjoterapeucie uroginekologicznemu."
    format: html
  - term: "Żylaki"
    definition: "Poszerzenia żył powierzchniowych z niewydolnością zastawkową; bezwzględnie unika się głębokiego masażu i ucisku na przebieg żylaków — dopuszczalne jest jedynie delikatne głaskanie odprowadzające poza obszarem zmian, po konsultacji lekarskiej."
    format: html
  - term: "Zakrzepica żył głębokich (DVT)"
    definition: "Ostre zakrzepowe zapalenie żył głębokich — przeciwwskazanie BEZWZGLĘDNE do jakiegokolwiek masażu kończyny i do zabiegów mogących zwiększyć ryzyko zatorowości płucnej; objawy (jednostronny ból, obrzęk, ocieplenie, zaczerwienienie) wymagają natychmiastowej pomocy lekarskiej (Załącznik E.6)."
    format: html
  - term: "Zatorowość płucna (PE)"
    definition: "Zagrożenie życia: nagła duszność, ból w klatce, tachykardia — masażysta przerywa wszelkie czynności i wzywa pomoc (112/999), układa klienta wg potrzeby i monitoruje do przyjazdu ratowników."
    format: html
  - term: "Nadciśnienie tętnicze"
    definition: "Podwyższone ciśnienie tętnicze; masaż relaksacyjny o łagodnej sile jest zwykle bezpieczny, lecz unika się technik silnie pobudzających i gwałtownych zmian pozycji; przy wartościach bardzo wysokich lub objawach — konsultacja lekarska."
    format: html
  - term: "Osteoporoza"
    definition: "Zmniejszona wytrzymałość kości; masażysta stosuje techniki powierzchowne, bez głębokiego ucisku na żebra i kręgosłup, szczególnie u osób starszych; wszelkie nowe bóle kostne zgłasza lekarzowi."
    format: html
  - term: "Nowotwór złośliwy"
    definition: "Choroba, w której masaż jest dopuszczalny wyłącznie za pisemną zgodą/onkologa i poza obszarem zmiany, naczyń limfatycznych po limfadenektomii oraz pola napromieniania; celem jest komfort, nie „leczenie guza” (Załącznik E.11)."
    format: html
  - term: "Insulina i cukrzyca"
    definition: "U klientów z cukrzycą masażysta pyta o stabilność glikemii i sposób odżywiania; unika głębokiego masażu okolic iniekcji insuliny i ocenia czucie na stopach (neuropatia); przy objawach hipoglikemii — przerwać zabieg, podać cukier prosty, wezwać pomoc jeśli brak poprawy."
    format: html
  - term: "Neuropatia obwodowa"
    definition: "Upośledzenie czucia (najczęściej stopu) — klient nie odczuwa bólu ochronnego; masażysta stosuje mniejszą siłę, sprawdza temperaturę i integralność skóry, instruując o codziennej samokontroli stóp."
    format: html
  - term: "Padaczka"
    definition: "Napady drgawkowe; masaż relaksacyjny bywa dobrze tolerowany, lecz unika się silnych technik na głowę i kark, zapewnia dyskrecję i bezpieczeństwo otoczenia; w razie napadu — pozycja boczna, ochrona głowy, nie wkładać nic do ust, czas trwania >5 min = 112."
    format: html
  - term: "Migrena"
    definition: "Silny, pulsujący ból głowy często z nudnościami i nadwrażliwością na bodźce; masaż karku i barków o umiarkowanej sile może pomóc w profilaktyce napięciowej, ale w trakcie ataku priorytetem jest cisza, półmrok i decyzja klienta; objawy alarmowe (nagły „najgorszy ból życia”) → pilna pomoc lekarska."
    format: html
  - term: "Ból"
    definition: "Subiektywne, nieprzyjemne dozucie związane z uszkodzeniem tkanek; masażysta mierzy jego natężenie skalą liczbową (Karta oceny bólu C.5), obserwuje reakcje wegetatywne i reaguje: ból ostry, promieniujący lub narastający = sygnał do przerwania techniki i konsultacji."
    format: html
  - term: "Skala VAS/NRS"
    definition: "Wizualna/skalа numeryczna oceny bólu 0–10; narzędzie komunikacji z klientem i dokumentacji zmian przed/po zabiegu; nie służy do rozpoznawania choroby, lecz do śledzenia komfortu."
    format: html
  - term: "Efekt analgetyczny masażu"
    definition: "Zmniejszenie odczuwania bólu po zabiegu dzięki bramkowanemu hamowaniu nocicepcji (Teoria bramki Melzacka-Walla), poprawie krążenia i rozluźnieniu napięcia mięśniowego; efekt jest objawowy, nie przyczynowy."
    format: html
  - term: "Przeciwobrzękowe bandażowanie kompresyjne"
    definition: "Stosowanie opasek o odpowiedniej gradacji ucisku w terapii obrzęków; dobór ciśnienia i techniki nakładania należy do terapeuty przeszkolonego i odbywa się na zlecenie lekarza; masażysta asystuje i uczy pielęgnacji."
    format: html
  - term: "Uraz zamknięty vs otwarty"
    definition: "Zamknięty — bez przerwania ciągłości skóry (stłuczenie, skręcenie); otwarty — z raną (ryzyko zakażenia, krwawienie); w obu przypadkach pierwsza pomoc wg Załącznika J/E, a masaż w okolicy urazu wyłącznie w okresie wskazanym przez lekarza."
    format: html
  - term: "Pozycja bezpieczna (boczna ustalona)"
    definition: "Układanie nieprzytomnego, oddychającego klienta na boku z zabezpieczeniem głowy — chroni drogi oddechowe przed zachłyśnięciem; element procedury J.10."
    format: html
  - term: "AED (automatyczny defibrylator zewnętrzny)"
    definition: "Urządzenie analizujące rytm serca i podające wstrząs, gdy jest wskazany; masażysta umie je uruchomić i stosować zgodnie z instrukcją głosową (J.9); po każdym użyciu zgłasza zdarzenie i dokumentuje."
    format: html
  - term: "Rekrutacja jednostek motorycznych"
    definition: "Proces angażowania kolejnych jednostek motorycznych do zwiększania siły skurczu; masaż izometryczny i techniki napinająco-rozluźniające wykorzystują tę zasadę w kontrolowanych warunkach szkolnych i leczniczych."
    format: html
  - term: "Sumacja skurczów (tężcowa/fuzja)"
    definition: "Nakładanie się skurczów przy wysokiej częstotliwości bodźców; mechanizm wyjaśnia, dlaczego gwałtowne, częste techniki pobudzające mają ograniczenia czasowe i nie stosuje się ich u osób z nadreaktywnością nerwowo-mięśniową bez zgody lekarza."
    format: html
  - term: "Regeneracja potreningowa"
    definition: "Odpoczynek, sen, żywienie i nawodnienie po wysiłku; masaż jest jednym ze środków wspomagających subiektywny komfort i elastyczność tkanek, nie substytutem snu ani leczenia kontuzji."
    format: html
  - term: "Odpowiedzialność pracodawcy (BHP)"
    definition: "Obowiązek zapewnienia bezpiecznych warunków pracy, szkoleń BHP, badań profilaktycznych i środków ochrony (art. 207 Kodeksu pracy); masażysta jako pracownik współodpowiada za stosowanie procedur (Załącznik B)."
    format: html
  - term: "Szkolenie BHP okresowe"
    definition: "Powtarzane szkolenie bezpieczeństwa pracowników zatrudnionych na stanowiskach związanych z obciążeniem fizycznym i kontaktem z klientem; kurs MED.10 obejmuje moduł 1 jako podstawę teoretyczną takiego szkolenia."
    format: html
  - term: "Środki ochrony indywidualnej (ŚOI)"
    definition: "Rękawiczki jednorazowe, fartuch, obuwie antypoślizgowe, ewentualnie maseczka przy zabiegach z ryzykiem aerozolu; dobór do sytuacji, obowiązki zakładania i zdejmowania określa Załącznik I."
    format: html
  - term: "Postępowanie z odpadami medycznymi"
    definition: "Odpady komunalne vs medyczne (np. zużyte plastry, materiały ze krwią); segregacja do pojemników oznaczonych zgodnie z procedurą B.5 i ustawą o odpadach; masażysta nie wrzuca odpadów potencjalnie zakaźnych do kosza zwykłego."
    format: html
  - term: "Instrukcja stanowiskowa"
    definition: "Dokument określający zasady bezpiecznego wykonywania pracy na stanowisku masażysty: organizację stanowiska, kolejność czynności, zagrożenia i działania awaryjne (B.2)."
    format: html
  - term: "Audyt higieniczny"
    definition: "Okresowa ocena zgodności praktyki z procedurami aseptyki (I.10): mycie/dezynfekcja rąk, czyszczenie stołu, stan tekstyliów, terminy preparatów; wyniki dokumentuje się i wykorzystuje do doskonalenia."
    format: html
  - term: "Test alergiczny preparatu"
    definition: "Próba naniesienia niewielkiej ilości olejku/kremu na skórę przedramienia i odczekanie doby przed pierwszym użyciem u nowego klienta (H.10); zapobiega reakcjom kontaktowym i chroni klienta."
    format: html
  - term: "Preparaty rozgrzewające/chłodzące"
    definition: "Środki wspomagające zawierające m.in. kapsaicynę, mentol; stosowane ostrożnie, na skórę nieuszkodzoną, bez kontaktu z oczami i błonami; nie stosuje się ich przed wysiłkiem u dzieci ani u osób z neuropatią bez zgody lekarza (H.7, H.8)."
    format: html
  - term: "Masaż przyrządowy"
    definition: "Masaż wykonywany aparatem wibracyjnym lub rolką mechaniczną; dobiera się częstotliwość i czas, unika kości, naczyń, zmian skórnych; urządzenie musi mieć aktualne przeglądy (D.15)."
    format: html
  - term: "Gorące kamienie bazaltowe"
    definition: "Kamienie ogrzewane zwykle do ok. 45–50°C; temperaturę zawsze sprawdzasz na własnym przedramieniu i pytasz klienta o odczucie; przeciwwskazane przy zaburzeniach czucia, żylakach, stanach zapalnych i ciąży bez zgody lekarza (D.14)."
    format: html
  - term: "Masaż biurowy"
    definition: "Krótka (10–20 min) forma masażu prozdrowotnego na krześle, przez ubranie, skupiona na karku, barkach i grzbiecie; cele: redukcja napięcia i edukacja ergonomiczna; nie zastępuje diagnostyki bólów kręgosłupa."
    format: html
  - term: "Relaksacja progresywna"
    definition: "Technika świadomego napinania i rozluźniania grup mięśniowych (Jacobson); masażysta łączy ją z oddechem przeponowym w masażu relaksacyjnym, tworząc bezpieczną rutynę dla klienta zestresowanego."
    format: html
  - term: "Oddech przeponowy"
    definition: "Tor oddechowy z aktywną przeponą; sprzyja obniżeniu napięcia sympatycznego; masażysta instruuje go w ramach edukacji prozdrowotnej (6.9), pamiętając, że nie jest terapeutą oddechowym w sensie medycznym."
    format: html
  - term: "Granice kompetencji masażysty"
    definition: "Zbiór czynności wykraczających poza kwalifikację MED.10: rozpoznawanie chorób, interpretacja badań, manipulacje stawowe wysokiego ryzyka, zabiegi invasive; przekroczenie granicy = zagrożenie zdrowia klienta i odpowiedzialność prawna (Załącznik M)."
    format: html
  - term: "Kwalifikacja do zabiegu"
    definition: "Decyzja „tak / nie / do lekarza” podejmowana na podstawie wywiadu, oglądu i kart Załączników D–E; każdą wątpliwość rozstrzyga się na korzyść bezpieczeństwa klienta."
    format: html
  - term: "Ocena funkcjonalna w gabinecie masażu"
    definition: "Prosta obserwacja ruchu (zakresy, wzorce, ból przy ruchu) służąca planowaniu zabiegu i komunikacji z zespołem; nie jest badaniem lekarskim ani fizjoterapeutycznym w pełnym sensie."
    format: html
  - term: "Zespół wielodyscyplinarny"
    definition: "Współpraca lekarza, fizjoterapeuty, masażysty, pielęgniarki, psychologa i innych specjalistów wokół klienta; masażysta wnosi obserwacje z zabiegów i realizuje ustalenia zespołu (3.19)."
    format: html
  - term: "Efekty kształcenia (EK)"
    definition: "Mierzliwe osiągnięcia ucznia po module (mapa A); formułowane w kategoriach wiedzy, umiejętności i kompetencji społecznych; służą planowaniu zajęć, ocenianiu i samoocenie gotowości do egzaminu."
    format: html
  - term: "Egzamin potwierdzający kwalifikację MED.10"
    definition: "Egzamin zawodowy składający się z części pisemnej (test) i praktycznej (stanowisko egzaminacyjne); warunki przystąpienia i kryteria oceny opisuje moduł 11 i przepisy CKE/OKE."
    format: html
  - term: "Portfel/Portfolio praktykanta"
    definition: "Zbiór udokumentowanych doświadczeń praktycznych: karty zabiegów, dziennik, refleksje, oceny opiekuna; wspiera samoocenę i rozmowę egzaminacyjną (moduł 10)."
    format: html
  - term: "Autokorekta techniki"
    definition: "Nawyk oceniania własnego wykonania po każdym zabiegu szkolnym wg check-list F; przyspiesza nabycie płynności i eliminuje błędy przeciążeniowe."
    format: html
  - term: "Nauczanie kolegialne (peer teaching)"
    definition: "Wspólne ćwiczenie w parach: raz masażysta, raz klient; uczy empatii, komunikacji i dawania informacji zwrotnej zgodnie z zasadą szacunku."
    format: html
  - term: "Informacja zwrotna konstruktywna"
    definition: "Konkretny, rzeczowy komentarz o zachowaniu (nie o osobie), wskazujący co poprawić i jak; fundament kultury zajęć praktycznych i oceniania koleżeńskiego."
    format: html
  - term: "Spójność przekazu (język obcy zawodowy)"
    definition: "Umiejętność przedstawienia oferty, procedury i ostrzeżeń w języku obcym na poziomie A2/B1 z wykorzystaniem słownictwa G.10; wspiera bezpieczeństwo klienta obcojęzycznego (moduł 7)."
    format: html
  - term: "Kompensacyjna strategia komunikacyjna"
    definition: "Sposoby radzenia sobie z luką językową: parafraza, gest, rysunek, słownik fotograficzny, prośba o powtórzenie; etycznie niedopuszczalne jest „zgadywanie” znaczenia zagrażającego bezpieczeństwu."
    format: html
  - term: "Kultura organizacyjna gabinetu"
    definition: "Wspólnie przyjęte normy: punktualność, czystość, poufność, uprzejmość wobec klienta i współpracowników; buduje bezpieczeństwo psychiczne i jakość usługi (8.1, 9.x)."
    format: html
  - term: "Rozwiązywanie konfliktów (mediacja)"
    definition: "Etapy: opisać fakt, wysłuchać strony, wskazać interesy, szukać rozwiązania korzystnego; eskalacja do przełożonego, gdy bezpieczeństwo klienta jest zagrożone (8.9)."
    format: html
  - term: "Radzenie sobie ze stresem"
    definition: "Techniki oddechowe, przerwy, higiena snu, wsparcie zespołu, superwizja; chroniczny stres obniża precyzję manualną i empatię — dlatego jest tematem modułu 8.6."
    format: html
  - term: "Ustawiczne dokształcanie"
    definition: "Obowiązek moralny i praktyczny: śledzenie wytycznych, kursy doskonalące, lektura źródeł z Załącznika L; gwarancja, że wiedza masażysty nie staje się przestarzała (K.10)."
    format: html
