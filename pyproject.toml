[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "magic-moodle-course-maker"
version = "0.1.0"
description = "Uniwersalny rdzeń do analizy i walidacji kursów Moodle"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
magic-moodle = "magic_moodle.cli:main"

[tool.setuptools.packages.find]
include = ["magic_moodle*"]

[tool.pytest.ini_options]
testpaths = ["tests/core"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
