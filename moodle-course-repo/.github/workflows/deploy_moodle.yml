name: Deploy to Moodle Server

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Moodle environment (staging/production)'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Download or build course backup
      id: get_backup
      run: |
        if gh release view latest --json assets --jq '.assets[].name' | grep -q course-backup.mbz; then
          gh release download latest --pattern course-backup.mbz
          echo "backup_exists=true" >> $GITHUB_OUTPUT
        else
          python scripts/convert_to_mbz.py --output course-backup.mbz
          echo "backup_exists=false" >> $GITHUB_OUTPUT
        fi
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Deploy to Moodle via SSH
      if: ${{ vars.MOODLE_SSH_HOST != '' }}
      run: |
        echo "${{ secrets.MOODLE_SSH_KEY }}" > deploy_key.pem
        chmod 600 deploy_key.pem
        
        scp -i deploy_key.pem \
          -o StrictHostKeyChecking=no \
          course-backup.mbz \
          ${{ secrets.MOODLE_SSH_USER }}@${{ vars.MOODLE_SSH_HOST }}:/tmp/course-backup.mbz
        
        ssh -i deploy_key.pem \
          -o StrictHostKeyChecking=no \
          ${{ secrets.MOODLE_SSH_USER }}@${{ vars.MOODLE_SSH_HOST }} \
          "php ${{ vars.MOODLE_PATH }}/admin/cli/restore.php \
            --file=/tmp/course-backup.mbz \
            --categoryid=${{ vars.MOODLE_CATEGORY_ID }} \
            --userid=${{ vars.MOODLE_ADMIN_USERID }} \
            --overwrite=1 \
            --non-interactive"
        
        rm deploy_key.pem
    
    - name: Deploy via Moodle Web Services API
      if: ${{ vars.MOODLE_WEB_SERVICE_URL != '' }}
      run: |
        python -c "
import requests
import sys

url = '${{ vars.MOODLE_WEB_SERVICE_URL }}'
token = '${{ secrets.MOODLE_WEB_SERVICE_TOKEN }}'
course_id = '${{ vars.MOODLE_COURSE_ID }}'

with open('course-backup.mbz', 'rb') as f:
    files = {'file': f}
    data = {
        'wstoken': token,
        'wsfunction': 'core_course_import_course',
        'moodlewsrestformat': 'json',
        'courseid': course_id
    }
    response = requests.post(url, files=files, data=data)
    
if response.status_code == 200:
    result = response.json()
    if 'error' in result:
        print(f\"Error: {result['error']}\")
        sys.exit(1)
    else:
        print(f\"Success: {result}\")
else:
    print(f\"HTTP Error: {response.status_code}\")
    sys.exit(1)
"
    
    - name: Notify deployment status
      if: always()
      run: |
        echo "Deployment completed at $(date)"
        echo "Environment: ${{ github.event.inputs.environment || 'staging' }}"
        echo "Backup file: course-backup.mbz"